[package]
name = "nexus-host"
description = "Engine for hosting VST3 and CLAP audio plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
base64.workspace = true
clack-host.workspace = true
clack-extensions.workspace = true
crossbeam-channel.workspace = true
raw-window-handle.workspace = true
# VST3 hosting: pure-Rust COM bindings (renamed to avoid clashing with our
# `vst3` module) + dynamic loading of the plugin bundle binary.
vst3-sdk = { version = "0.3", package = "vst3" }
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
# NSBundle: a real CFBundle (toll-free bridged) for VST3 macOS module loading.
objc2-foundation = { workspace = true, features = ["NSBundle"] }
egui = { workspace = true, optional = true }

[features]
# Optional egui "wrapper UI" (plugin selector, presets, editor frame), reused by
# nexus-app and nexus-wrap. Off by default so the bare library — and a future
# web DAW — pull in no egui.
ui = ["dep:egui"]

# Hosting a VST3 runs its module init (bundleEntry) on the main thread, so this
# end-to-end check uses a custom main() (harness = false) instead of the default
# test harness (which runs tests on worker threads). Opt in via NEXUS_VST3_TEST=1.
[[test]]
name = "vst3_render"
harness = false
