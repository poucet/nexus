[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Christophe Poucet <christophe.poucet@gmail.com>"]
repository = "https://github.com/poucet/nexus"
rust-version = "1.90"

[workspace.dependencies]
# Internal crates
nexus-host = { path = "crates/nexus-host" }
nexus-tools = { path = "crates/nexus-tools" }
nexus-rest = { path = "crates/nexus-rest" }
nexus-mcp = { path = "crates/nexus-mcp" }
simply-fugue = { path = "crates/simply-fugue" }

# Shared third-party dependencies are pinned here so every crate in the
# workspace resolves to the same version.
thiserror = "2"
log = "0.4"
hound = "3.5"
rmcp = { version = "0.9.1", features = ["server", "transport-streamable-http-server", "transport-io"] }

# CLAP hosting via clack (tracks the main branch, like droplets).
clack-host = { git = "https://github.com/prokopyl/clack.git", rev = "f874e858ad576c601367b3038af5088a4e671744" }
clack-plugin = { git = "https://github.com/prokopyl/clack.git", rev = "f874e858ad576c601367b3038af5088a4e671744" }
clack-extensions = { git = "https://github.com/prokopyl/clack.git", rev = "f874e858ad576c601367b3038af5088a4e671744", features = ["clack-host", "clack-plugin", "all-extensions", "raw-window-handle_06"] }


crossbeam-channel = "0.5"
# Editor embedding: parent a plugin's view into a host window. Matches the
# version clack (raw_window_handle_06) and eframe use.
raw-window-handle = "0.6"

# macOS native window for the plugin editor (objc2 / AppKit). Versions match
# what cpal/winit already pull into the tree.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# egui for the optional wrapper UI (`ui` feature). The app brings `eframe`.
# Pinned to 0.31 — newer egui (0.34) requires rustc 1.92; we target 1.90.
egui = "0.31"

# nexus-app: windowing + audio/MIDI devices + file dialogs. The wgpu renderer
# (Metal on macOS) keeps the host UI off OpenGL, which VST3 plugin editors
# clobber (grey flicker under the default glow renderer).
eframe = { version = "0.31", features = ["wgpu"] }
cpal = "0.15"
midir = "0.10"
rtrb = "0.3"
rfd = "0.15"
env_logger = "0.11"
# Portable native menu bar (macOS top-bar, Windows/Linux).
muda = "0.19"

# Used by the xtask build helper.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

# nexus-tools: transport-agnostic tool surface (see docs/design/STATE_TOOLS.md).
# schemars pinned to 1.x — what rmcp 0.9 expects when the MCP frontend lands.
schemars = "1"
async-trait = "0.1"
futures = "0.3"
sha2 = "0.10"
flate2 = "1"

# nexus-rest: the human debug frontend (axum on its own thread + runtime).
# Pins match droplets' known-working combination.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
