[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Christophe Poucet <christophe.poucet@gmail.com>"]
repository = "https://github.com/poucet/nexus"
rust-version = "1.90"

[workspace.dependencies]
# Internal crates
nexus-host = { path = "crates/nexus-host" }

# Shared third-party dependencies are pinned here so every crate in the
# workspace resolves to the same version.
thiserror = "2"
log = "0.4"

# Used by the xtask build helper.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
